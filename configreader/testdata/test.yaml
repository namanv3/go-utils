connection:
  url: ${{CONNECTION_URL:-0.0.0.0}}
  port: ${{CONNECTION_PORT:-8080}}

database:
  type: mongodb
  spec:
    url: ${{MONGO_URL}}
    username: admin
    password: ${{MONGO_PASSWORD:-admin}}

startingMessage: ${{STARTING_MESSAGE:-this is a message for you}}

optionally: ${{optionalField:-}}